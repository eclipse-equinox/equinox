source.. = src/,\
           osgi/
output.. = bin/
bin.includes = META-INF/,\
               .,\
               hookconfigurators.properties,\
               about.html,\
               fragment.properties

## Configuration for TCK tests to execute for this project
pom.model.property.tck.artifact = org.osgi.test.cases.serviceloader,org.eclipse.osgi
pom.model.property.surefire.testArgLine = -Dosgi.framework.extensions=reference:file:${project.build.directory}/${project.artifactId}-${project.version}.jar
## org.eclipse.equinox.spi is a framework extension (Fragment-Host: org.eclipse.osgi;extension:=framework).
## Equinox's HookRegistry only discovers hookconfigurators.properties (and therefore only registers the
## ServiceLoaderMediatorHook) by scanning the classpath of the classloader that loaded org.eclipse.osgi itself,
## and only does so once, at framework construction time. When org.eclipse.equinox.spi is merely installed as a
## regular bundle at runtime (as the generic bnd/OSGi TCK launcher does via -runrequires), that scan has already
## happened and the hook is never registered, so the SPI mediator implementation stays completely inert.
## Adding it to -runpath puts its classes on the framework's own classloader from the start, so the
## hookconfigurators.properties scan picks it up like PDE's JUnit launch does via -Dosgi.framework.extensions.
pom.model.property.tck.runpath = org.eclipse.equinox.spi
## org.eclipse.equinox.spi is a framework extension (Fragment-Host: org.eclipse.osgi;extension:=framework), so its
## own Fragment-Host requirement can never be resolved by bnd's static resolver, since org.eclipse.osgi never
## statically declares an osgi.wiring.host capability for itself (only the running framework provides that
## dynamically). Declare it as a synthetic system capability so bnd's resolver can put this bundle in -runbundles.
pom.model.property.tck.runsystemcapabilities = osgi.wiring.host;osgi.wiring.host=org.eclipse.osgi;bundle-version:Version=3.24.0
